[package]
name = "atray"
description = "Simple file relay tray; cross-platform alternative to Yoink"
version = "0.1.0"
edition = "2024"

[package.metadata.bundle]
identifier = "moe.prwk.atray"
icon = ["assets/icon.png", "assets/icon.icns"]
category = "Utility"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["assets/Info.plist.ext"]
deb_depends = ["libc6", "libx11-6", "libxkbcommon0", "libwayland-client0"]

[dependencies]
anyhow = "1"
dirs = "7"
findfont = "0.2"
font-kit = "0.14"
iced = { version = "0.14", features = ["advanced", "image"] }
image = "0.25"
native-theme-iced = "0.5"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
tempfile = "3"
toml = "1"
tray-icon = "0.25"

[target.'cfg(target_os = "windows")'.dependencies]
windows = "0.62"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"

[target.'cfg(not(target_os = "macos"))'.dependencies]
# use git version so we have wayland
rdev = { git = "https://github.com/Narsil/rdev.git", features = ["wayland", "x11"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
native-theme = { version = "0.5.8", features = ["macos"] }
objc2 = "0.6"
objc2-core-foundation = "0.3"
objc2-core-graphics = { version = "0.3", features = [
    "CGEventSource",
    "CGEventTypes",
    "CGImage",
] }
objc2-foundation = "0.3"
objc2-quick-look-thumbnailing = "0.3"
objc2-app-kit = { version = "0.3", features = [
    "NSDragging",
    "NSDraggingItem",
    "NSDraggingSession",
    "NSEvent",
    "NSImage",
    "NSPasteboard",
    "NSRunningApplication",
    "NSView",
    "NSWindow",
    "NSWorkspace",
] }
