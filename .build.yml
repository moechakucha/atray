image: debian/stable

secrets:
  - c4535cec-7c9b-4ca6-a8a9-9425e175d6da

packages:
  - bison
  - build-essential
  - clang
  - cmake
  - curl
  - flex
  - genisoimage
  - git
  - libbz2-dev
  - liblzma-dev
  - libssl-dev
  - libxml2-dev
  - lld
  - llvm
  - msitools
  - patch
  - pkg-config
  - python3
  - xz-utils
  - zlib1g-dev

environment:
  MACOS_TARGETS: aarch64-apple-darwin x86_64-apple-darwin
  WINDOWS_TARGETS: x86_64-pc-windows-msvc aarch64-pc-windows-msvc
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  MACOS_SDK_URL: https://github.com/joseluisq/macosx-sdks/releases/download/13.3/MacOSX13.3.sdk.tar.xz
  OSXCROSS: /home/build/osxcross
  LIBDMG_HFSPLUS: /home/build/libdmg-hfsplus

sources:
  - git+ssh://git@git.sr.ht/~flamarine/atray

tasks:
  - mirror-to-github: |
      cd "$HOME/atray"
      ssh-keyscan -t rsa github.com >> ~/.ssh/known_hosts
      git remote add github git@github.com:moechakucha/atray.git
      git push --prune github '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

  - setup: |
      set -eux

      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
        | sh -s -- -y --profile minimal --default-toolchain stable
      . "$HOME/.cargo/env"

      for target in $MACOS_TARGETS $WINDOWS_TARGETS; do
        rustup target add "$target"
      done

      rustup component add llvm-tools

      cargo install --locked cargo-xwin

      export PATH="$(dirname "$(readlink -f "$(command -v clang)")"):$PATH"

      cargo xwin cache xwin

      if [ ! -d "$OSXCROSS/.git" ]; then
        git clone --depth 1 https://github.com/tpoechtrager/osxcross "$OSXCROSS"
      fi

      mkdir -p "$OSXCROSS/tarballs"
      curl -L --fail -o "$OSXCROSS/tarballs/$(basename "$MACOS_SDK_URL")" "$MACOS_SDK_URL"
      ( cd "$OSXCROSS" && UNATTENDED=1 ./build.sh )

      if [ ! -d "$LIBDMG_HFSPLUS/.git" ]; then
        git clone --depth 1 https://github.com/fanquake/libdmg-hfsplus "$LIBDMG_HFSPLUS"
      fi

      ( cd "$LIBDMG_HFSPLUS" && cmake . && make -j"$(nproc)" )

  - bundle: |
      set -eux
      . "$HOME/.cargo/env"

      cd "$HOME/atray"

      export PATH="$OSXCROSS/target/bin:$PATH"
      export DMG_TOOL="$LIBDMG_HFSPLUS/dmg/dmg"

      for target in $MACOS_TARGETS; do
        case "${target%%-*}" in
          aarch64|arm64) pattern='arm64|aarch64' ;;
          x86_64) pattern='x86_64' ;;
          *)
            echo "unsupported target: $target" >&2
            exit 1
            ;;
        esac

        clang="$(ls "$OSXCROSS/target/bin" | grep -E "^($pattern)-apple-darwin.*-clang$" | head -n1)"

        if [ -z "$clang" ]; then
          echo "no osxcross clang wrapper for $target" >&2
          exit 1
        fi

        upper="$(printf '%s' "$target" | tr 'a-z-' 'A-Z_')"
        lower="$(printf '%s' "$target" | tr '-' '_')"

        env \
          "CARGO_TARGET_${upper}_LINKER=$clang" \
          "CC_${lower}=$clang" \
          "CXX_${lower}=${clang}++" \
          cargo xtask dmg --target "$target" --out dist
      done

  - bundle-windows: |
      set -eux
      . "$HOME/.cargo/env"

      cd "$HOME/atray"

      export PATH="$(dirname "$(readlink -f "$(command -v clang)")"):$PATH"

      for target in $WINDOWS_TARGETS; do
        cargo xwin build --release --bin atray --target "$target"
        cargo xtask msi --target "$target" --no-build --out dist
      done

artifacts:
  - atray/dist/atray-aarch64.dmg
  - atray/dist/atray-x86_64.dmg
  - atray/dist/atray-aarch64.msi
  - atray/dist/atray-x86_64.msi
